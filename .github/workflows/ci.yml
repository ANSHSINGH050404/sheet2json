name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `prisma generate` only needs a syntactically valid URL, never a reachable
      # server. Without one it aborts while reading prisma.config.ts.
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: bunx prisma generate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run check

      # No DATABASE_URL here on purpose: the database integration tests are
      # skipped, so CI needs no database and cannot write to production.
      - name: Test
        run: bun test

      - name: Build
        run: bun run build

# Vercel's Git integration deploys master to production on its own, so this
# workflow only has to prove the code is sound. It deliberately does not deploy
# or migrate: doing both here duplicated Vercel's own deploy and needed four
# repository secrets that were never configured, which failed every master push.
#
# Migrations are applied by hand, before merging the code that needs them:
#   bun run db:deploy
# Keep every migration backwards compatible, because Vercel deploys from the
# merge commit and cannot be sequenced against a migration the way a CI job can.
